name: Deploy Staging Backend & Runners to EC2

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      force_rebuild_all_runners:
        description: 'Force rebuild all Docker runner images on GHCR'
        type: boolean
        required: false
        default: false

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      c: ${{ steps.filter.outputs.c == 'true' || github.event.inputs.force_rebuild_all_runners == 'true' }}
      cpp: ${{ steps.filter.outputs.cpp == 'true' || github.event.inputs.force_rebuild_all_runners == 'true' }}
      java: ${{ steps.filter.outputs.java == 'true' || github.event.inputs.force_rebuild_all_runners == 'true' }}
      python: ${{ steps.filter.outputs.python == 'true' || github.event.inputs.force_rebuild_all_runners == 'true' }}
      backend: ${{ steps.filter.outputs.backend }}
      any_runner: ${{ steps.filter.outputs.c == 'true' || steps.filter.outputs.cpp == 'true' || steps.filter.outputs.java == 'true' || steps.filter.outputs.python == 'true' || github.event.inputs.force_rebuild_all_runners == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Path Filter Detection
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            c:
              - 'code-execution/c/**'
            cpp:
              - 'code-execution/cpp/**'
            java:
              - 'code-execution/java/**'
            python:
              - 'code-execution/python/**'
            backend:
              - 'backend/**'
              - 'admin/**'
              - 'package*.json'
              - '.github/workflows/deploy-staging.yml'

  build-c-runner:
    name: Build & Push C Runner
    needs: detect-changes
    if: needs.detect-changes.outputs.c == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Repository Owner to Lowercase
        id: repo-owner
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push C Runner Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./code-execution/c
          push: true
          tags: ghcr.io/${{ steps.repo-owner.outputs.owner }}/askursenior-c-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-cpp-runner:
    name: Build & Push C++ Runner
    needs: detect-changes
    if: needs.detect-changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Repository Owner to Lowercase
        id: repo-owner
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push C++ Runner Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./code-execution/cpp
          push: true
          tags: ghcr.io/${{ steps.repo-owner.outputs.owner }}/askursenior-cpp-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-java-runner:
    name: Build & Push Java Runner
    needs: detect-changes
    if: needs.detect-changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Repository Owner to Lowercase
        id: repo-owner
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Java Runner Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./code-execution/java
          push: true
          tags: ghcr.io/${{ steps.repo-owner.outputs.owner }}/askursenior-java-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-python-runner:
    name: Build & Push Python Runner
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Repository Owner to Lowercase
        id: repo-owner
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Python Runner Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./code-execution/python
          push: true
          tags: ghcr.io/${{ steps.repo-owner.outputs.owner }}/askursenior-python-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to EC2 Staging
    needs:
      - detect-changes
      - build-c-runner
      - build-cpp-runner
      - build-java-runner
      - build-python-runner
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.build-c-runner.result == 'success' || needs.build-c-runner.result == 'skipped') &&
      (needs.build-cpp-runner.result == 'success' || needs.build-cpp-runner.result == 'skipped') &&
      (needs.build-java-runner.result == 'success' || needs.build-java-runner.result == 'skipped') &&
      (needs.build-python-runner.result == 'success' || needs.build-python-runner.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          eval $(ssh-agent -s)
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

          ssh-keyscan -t ed25519 "${{ secrets.EC2_HOST }}" > ~/.ssh/ec2_host_key

          ACTUAL_FINGERPRINT=$(ssh-keygen -lf ~/.ssh/ec2_host_key | awk '{print $2}')

          echo "Expected fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}"
          echo "Actual fingerprint:   $ACTUAL_FINGERPRINT"

          if [ "$ACTUAL_FINGERPRINT" != "${{ secrets.EC2_HOST_FINGERPRINT }}" ]; then
            echo "ERROR: EC2 host fingerprint does not match!"
            exit 1
          fi

          cp ~/.ssh/ec2_host_key ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Runners and Backend on EC2
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'bash -e -s' << 'EOF'
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # Authenticate to GHCR on EC2 if GHCR_READ_TOKEN secret is configured
            if [ -n "${{ secrets.GHCR_READ_TOKEN }}" ]; then
              echo "Authenticating to GHCR on EC2..."
              echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            # 1. Pull, verify digest, and retag C Runner if updated
            if [ "${{ needs.detect-changes.outputs.c }}" == "true" ]; then
              EXPECTED_C_DIGEST="${{ needs.build-c-runner.outputs.digest }}"
              echo "=== Pulling C runner from GHCR by digest: ${EXPECTED_C_DIGEST} ==="
              docker pull "ghcr.io/${OWNER}/askursenior-c-runner@${EXPECTED_C_DIGEST}"
              
              REPO_DIGESTS=$(docker inspect --format='{{range .RepoDigests}}{{.}} {{end}}' "ghcr.io/${OWNER}/askursenior-c-runner@${EXPECTED_C_DIGEST}")
              echo "Expected digest: $EXPECTED_C_DIGEST"
              echo "Available repo digests: $REPO_DIGESTS"

              if [[ "$REPO_DIGESTS" != *"$EXPECTED_C_DIGEST"* ]]; then
                echo "ERROR: Digest mismatch for C runner! Expected $EXPECTED_C_DIGEST"
                exit 1
              fi

              # Retag only after successful verification
              docker tag "ghcr.io/${OWNER}/askursenior-c-runner@${EXPECTED_C_DIGEST}" askursenior-c-runner:latest
              echo "Successfully verified and tagged askursenior-c-runner:latest"
            fi

            # 2. Pull, verify digest, and retag C++ Runner if updated
            if [ "${{ needs.detect-changes.outputs.cpp }}" == "true" ]; then
              EXPECTED_CPP_DIGEST="${{ needs.build-cpp-runner.outputs.digest }}"
              echo "=== Pulling C++ runner from GHCR by digest: ${EXPECTED_CPP_DIGEST} ==="
              docker pull "ghcr.io/${OWNER}/askursenior-cpp-runner@${EXPECTED_CPP_DIGEST}"
              
              REPO_DIGESTS=$(docker inspect --format='{{range .RepoDigests}}{{.}} {{end}}' "ghcr.io/${OWNER}/askursenior-cpp-runner@${EXPECTED_CPP_DIGEST}")
              echo "Expected digest: $EXPECTED_CPP_DIGEST"
              echo "Available repo digests: $REPO_DIGESTS"

              if [[ "$REPO_DIGESTS" != *"$EXPECTED_CPP_DIGEST"* ]]; then
                echo "ERROR: Digest mismatch for C++ runner! Expected $EXPECTED_CPP_DIGEST"
                exit 1
              fi

              docker tag "ghcr.io/${OWNER}/askursenior-cpp-runner@${EXPECTED_CPP_DIGEST}" askursenior-cpp-runner:latest
              echo "Successfully verified and tagged askursenior-cpp-runner:latest"
            fi

            # 3. Pull, verify digest, and retag Java Runner if updated
            if [ "${{ needs.detect-changes.outputs.java }}" == "true" ]; then
              EXPECTED_JAVA_DIGEST="${{ needs.build-java-runner.outputs.digest }}"
              echo "=== Pulling Java runner from GHCR by digest: ${EXPECTED_JAVA_DIGEST} ==="
              docker pull "ghcr.io/${OWNER}/askursenior-java-runner@${EXPECTED_JAVA_DIGEST}"
              
              REPO_DIGESTS=$(docker inspect --format='{{range .RepoDigests}}{{.}} {{end}}' "ghcr.io/${OWNER}/askursenior-java-runner@${EXPECTED_JAVA_DIGEST}")
              echo "Expected digest: $EXPECTED_JAVA_DIGEST"
              echo "Available repo digests: $REPO_DIGESTS"

              if [[ "$REPO_DIGESTS" != *"$EXPECTED_JAVA_DIGEST"* ]]; then
                echo "ERROR: Digest mismatch for Java runner! Expected $EXPECTED_JAVA_DIGEST"
                exit 1
              fi

              docker tag "ghcr.io/${OWNER}/askursenior-java-runner@${EXPECTED_JAVA_DIGEST}" askursenior-java-runner:latest
              echo "Successfully verified and tagged askursenior-java-runner:latest"
            fi

            # 4. Pull, verify digest, and retag Python Runner if updated
            if [ "${{ needs.detect-changes.outputs.python }}" == "true" ]; then
              EXPECTED_PYTHON_DIGEST="${{ needs.build-python-runner.outputs.digest }}"
              echo "=== Pulling Python runner from GHCR by digest: ${EXPECTED_PYTHON_DIGEST} ==="
              docker pull "ghcr.io/${OWNER}/askursenior-python-runner@${EXPECTED_PYTHON_DIGEST}"
              
              REPO_DIGESTS=$(docker inspect --format='{{range .RepoDigests}}{{.}} {{end}}' "ghcr.io/${OWNER}/askursenior-python-runner@${EXPECTED_PYTHON_DIGEST}")
              echo "Expected digest: $EXPECTED_PYTHON_DIGEST"
              echo "Available repo digests: $REPO_DIGESTS"

              if [[ "$REPO_DIGESTS" != *"$EXPECTED_PYTHON_DIGEST"* ]]; then
                echo "ERROR: Digest mismatch for Python runner! Expected $EXPECTED_PYTHON_DIGEST"
                exit 1
              fi

              docker tag "ghcr.io/${OWNER}/askursenior-python-runner@${EXPECTED_PYTHON_DIGEST}" askursenior-python-runner:latest
              echo "Successfully verified and tagged askursenior-python-runner:latest"
            fi

            echo "=== 5. Pulling latest development branch on EC2 ==="
            cd ~/ProjectAskurSenior

            git fetch origin
            git checkout development
            git reset --hard origin/development

            # Ensure swap space exists to prevent OOM killer on memory-constrained EC2 instances
            SWAP_TOTAL=$(free -m | awk '/^Swap:/ {print $2}')
            if [ -z "$SWAP_TOTAL" ] || [ "$SWAP_TOTAL" -eq 0 ]; then
              echo "No swap detected. Allocating 2GB swap to prevent OOM..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile || true
              sudo swapon /swapfile || true
            fi

            echo "=== 6. Installing backend dependencies ==="
            cd backend
            NODE_OPTIONS="--max-old-space-size=512" npm ci --omit=dev --no-audit --no-fund

            echo "=== 7. Building admin frontend ==="
            cd ~/ProjectAskurSenior/admin
            NODE_OPTIONS="--max-old-space-size=512" npm ci --no-audit --no-fund
            npm run build
            echo "Admin frontend built successfully."

             echo "=== Deploying admin frontend to Nginx ==="
             sudo rm -rf /var/www/askursenior-admin/*
             sudo cp -r ~/ProjectAskurSenior/admin/dist/. /var/www/askursenior-admin/
             sudo chown -R root:root /var/www/askursenior-admin
             sudo chmod -R 755 /var/www/askursenior-admin
             echo "Admin frontend deployed successfully."
            
            echo "=== 8. Restarting askursenior-backend systemd service ==="
            cd ~/ProjectAskurSenior/backend
            sudo systemctl restart askursenior-backend 

            echo "=== 9. Verifying systemd service status ==="
            sudo systemctl is-active --quiet askursenior-backend
            echo "Service askursenior-backend is active."

            echo "=== 10. Verifying local health endpoint with retry polling ==="
            HEALTH_OK=false
            for i in {1..30}; do
              if curl --fail --silent --show-error http://127.0.0.1:5000/api/health; then
                echo -e "\nBackend health check passed on attempt $i."
                HEALTH_OK=true
                break
              fi
              echo "Backend not ready yet. Retrying in 2s (Attempt $i/30)..."
              sleep 2
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "ERROR: Backend failed to become healthy within 60 seconds."
              sudo systemctl status askursenior-backend --no-pager
              sudo journalctl -u askursenior-backend -n 50 --no-pager
              exit 1
            fi

            echo -e "\n=== Staging backend deployment verified and complete! ==="
          EOF
